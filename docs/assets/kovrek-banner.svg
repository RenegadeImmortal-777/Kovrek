<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Kovrek 12.0 Sovereign Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle background grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Accent orb -->
  <circle cx="1060" cy="140" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="520" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Top pill badge -->
  <rect x="72" y="64" width="388" height="36" rx="18" fill="#0d1b2e" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="92" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#38bdf8">
    KOVREK 12.0 "SOVEREIGN"  •  MIT LICENSE
  </text>

  <!-- Headline -->
  <text x="72" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">
    Python Ergonomics.
  </text>
  <text x="72" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="56" font-weight="800" fill="url(#accent)">
    One Single-Binary Rust Runtime.
  </text>

  <text x="72" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="22" fill="#94a3b8">
    Static @verify proofs  •  Crash-safe simulation (sim_fs_crash)  •  x86_64/arm64 JIT  •  SPIR-V &amp; HLSL GPU  •  Wasm/PE/ELF AOT
  </text>

  <!-- Left code preview panel -->
  <rect x="72" y="328" width="600" height="248" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="96" cy="352" r="6" fill="#ef4444"/>
  <circle cx="116" cy="352" r="6" fill="#f59e0b"/>
  <circle cx="136" cy="352" r="6" fill="#10b981"/>
  <text x="160" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">
    tour.kvr — kovrek verify &amp;&amp; kovrek run
  </text>
  <text x="94" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#c084fc">@verify @secret</text>
  <text x="94" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#e2e8f0">fn safe_budget(limit: Int) -&gt; Int {</text>
  <text x="94" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#38bdf8">    requires(limit &gt;= 1, "limit &gt;= 1");</text>
  <text x="94" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#e2e8f0">    let step = 0; while step &lt; limit { step += 1; }</text>
  <text x="94" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#34d399">    ensures(step &gt;= 1, "step &gt;= 1");</text>
  <text x="94" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#e2e8f0">    return 1000 / step; // proven non-zero at compile time</text>
  <text x="94" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#e2e8f0">}</text>

  <!-- Right pillar cards -->
  <rect x="700" y="328" width="508" height="72" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="724" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#34d399">
    Formal @verify + Taint + @linear Ownership
  </text>
  <text x="724" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    Relational solver, AES-GCM/TOTP/SSRF crypto, capability sandbox
  </text>

  <rect x="700" y="416" width="508" height="72" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="724" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">
    3-Stage Self-Hosted Compiler + Multi-Backend
  </text>
  <text x="724" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    Bytecode VM, x86_64/arm64 JIT, SPIR-V/HLSL GPU, Wasm, PE/ELF AOT
  </text>

  <rect x="700" y="504" width="508" height="72" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="724" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#818cf8">
    144 Rust Tests  •  77 Packages  •  8/8 Release Gates
  </text>
  <text x="724" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    Zero Python dependency  •  Native SQLite WAL, HTTP/SSE, LSP &amp; DAP
  </text>
</svg>
