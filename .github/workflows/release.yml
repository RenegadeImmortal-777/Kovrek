name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_src: engine-rs/target/release/kovrek
            asset_name: kovrek-native-linux-x86_64
          - os: macos-latest
            bin_src: engine-rs/target/release/kovrek
            asset_name: kovrek-native-macos-arm64
          - os: windows-latest
            bin_src: engine-rs/target/release/kovrek.exe
            asset_name: kovrek-native-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - name: Build release binary
        working-directory: engine-rs
        run: cargo build --release --locked
      - name: Stage asset and SHA-256 digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp "${{ matrix.bin_src }}" "release-dist/${{ matrix.asset_name }}"
          (
            cd release-dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
            else
              shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
            fi
          )
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: release-dist/*
          if-no-files-found: error

  publish-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true
      - name: Generate and verify SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundle/*
