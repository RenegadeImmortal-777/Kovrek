name: Kovrek CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        working-directory: engine-rs
        run: cargo fmt --check
      - name: Installer script syntax check
        shell: bash
        run: sh -n install.sh
      - name: Unit tests
        working-directory: engine-rs
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --locked --no-fail-fast > test.log 2>&1; then
            cat test.log
            grep -E "^test .* FAILED|panicked at" test.log | tr -d '\r' | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            summary="$(tail -n 30 test.log | tr '\r\n' ' ')"
            echo "::error::TAIL: $summary"
            rm -f test.log
            exit 1
          fi
          cat test.log
          rm -f test.log
      - name: Portable core check
        working-directory: engine-rs
        run: cargo check --locked --no-default-features
      - name: Release build
        working-directory: engine-rs
        run: cargo build --release --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        working-directory: engine-rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  package-matrix-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release compiler
        working-directory: engine-rs
        run: cargo build --release
      - name: Validate registry packages (Windows)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-matrix.ps1
      - name: Validate ecosystem gate (Windows)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ecosystem-gate.ps1

  package-matrix-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release compiler
        working-directory: engine-rs
        run: cargo build --release
      - name: Validate registry packages (POSIX)
        run: sh ./scripts/package-matrix.sh
