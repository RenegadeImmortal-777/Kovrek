name: Autonomous Package Factory & PQ Bundle Publisher

on:
  schedule:
    # Runs automatically every 6 hours to synthesize a batch of formally verified
    # (@verify) & Post-Quantum Proof-Carrying Code (.pcc.json) certified packages
    # across 52 scientific/engineering domains x 60 algorithmic kernels x 60 regimes.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      grow_ecosystem:
        description: "Synthesize & commit formally verified packages into packages/"
        required: false
        default: "true"
      batch_size:
        description: "Number of new domain packages to synthesize in this run (1..200)"
        required: false
        default: "10"
  push:
    paths:
      - "packages/**"
      - "scripts/package_factory.kvr"
      - ".github/workflows/package-factory.yml"

permissions:
  contents: write

jobs:
  package-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs

      - name: Build Kovrek Sovereign Engine
        working-directory: engine-rs
        run: cargo build --release --locked

      - name: Run Autonomous Multi-Domain Package Synthesizer & PQ Registry Signer
        env:
          KOVREK_FACTORY_GROW: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.grow_ecosystem == 'true')) && '1' || '0' }}
          KOVREK_FACTORY_BATCH: ${{ github.event.inputs.batch_size || '5' }}
        run: |
          ./engine-rs/target/release/kovrek check scripts/package_factory.kvr
          ./engine-rs/target/release/kovrek run scripts/package_factory.kvr

      - name: Verify All Newly Synthesized Packages (Compile + Formal @verify + Import Run)
        run: |
          set -euo pipefail
          export KOVREK_HOME="$PWD"
          NEW_PKGS="$(git status --porcelain packages/ | awk '{print $2}' | cut -d/ -f2 | sort -u)"
          if [ -n "$NEW_PKGS" ]; then
            TMP_VERIFY="$(mktemp -d)"
            for pkg in $NEW_PKGS; do
              echo "Verifying synthesized package: $pkg"
              ./engine-rs/target/release/kovrek check "packages/${pkg}/${pkg}.kvr"
              ./engine-rs/target/release/kovrek verify "packages/${pkg}/${pkg}.kvr"
              proj="$TMP_VERIFY/$pkg"
              ./engine-rs/target/release/kovrek new "$proj" >/dev/null
              (
                cd "$proj"
                "$KOVREK_HOME/engine-rs/target/release/kovrek" add "$pkg" >/dev/null
                printf 'use "%s";\nlet pkg = import_package("%s");\nassert(len(keys(pkg)) > 0);\n' "$pkg" "$pkg" > src/main.kvr
                "$KOVREK_HOME/engine-rs/target/release/kovrek" check >/dev/null
                "$KOVREK_HOME/engine-rs/target/release/kovrek" run >/dev/null
              )
            done
            rm -rf "$TMP_VERIFY"
          fi

      - name: Pack .kvpkg.json Bundles
        run: |
          set -euo pipefail
          mkdir -p dist/packages/bundles
          for pkg_dir in packages/*; do
            if [ -d "$pkg_dir" ]; then
              pkg_name="$(basename "$pkg_dir")"
              ./engine-rs/target/release/kovrek pkg pack "$pkg_dir" "dist/packages/bundles/${pkg_name}.kvpkg.json"
            fi
          done

      - name: Commit & Push Newly Synthesized Verified Packages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain packages/ registry/index.json)" ]; then
            git config user.name "kovrek-autonomous-factory[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/ registry/index.json
            COUNT="$(git status --porcelain packages/ | awk '{print $2}' | cut -d/ -f2 | sort -u | wc -l | tr -d ' ')"
            FIRST_PKGS="$(git status --porcelain packages/ | awk '{print $2}' | cut -d/ -f2 | sort -u | head -n 5 | tr '\n' ' ')"
            git commit -m "feat(packages): autonomous synthesis & PCC verification of ${COUNT} package(s) (${FIRST_PKGS})"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No new package changes to commit."
          fi

      - name: Upload PQ-Signed Package Bundles & Registry Manifest
        uses: actions/upload-artifact@v4
        with:
          name: kovrek-pq-signed-packages
          path: dist/packages/**
          if-no-files-found: error
